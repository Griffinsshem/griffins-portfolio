<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Blueprint node: an outlined square with a solid accent node inside it,
       the same mark the hero schematic uses. Shapes only, no text, so it
       renders identically everywhere and depends on no font. -->
  <rect width="32" height="32" fill="#121210"/>
  <rect x="5.5" y="5.5" width="21" height="21" fill="none" stroke="#f3f2ee" stroke-width="1.5"/>
  <rect x="11" y="11" width="10" height="10" fill="#ff5c3c"/>
</svg>
